<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Juego del Hogar - Elige la imagen correcta</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2b4c7c);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 16px;
        }

        .game-container {
            background: white;
            border-radius: 32px;
            padding: 20px 16px 30px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 35px rgba(0,0,0,0.3);
            text-align: center;
            transition: all 0.3s ease;
        }

        h1 {
            color: #ff8c42;
            margin-top: 0;
            font-size: clamp(1.5rem, 6vw, 2rem);
            text-shadow: 2px 2px 0 #ffe0b5;
        }

        .start-screen, .quiz-screen, .end-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .start-screen {
            gap: 25px;
        }

        .start-screen p {
            font-size: clamp(0.9rem, 4vw, 1.2rem);
            margin: 0;
        }

        button {
            background: #ff8c42;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: clamp(1.2rem, 5vw, 1.5rem);
            font-weight: bold;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 6px 0 #b45a2b;
            transition: 0.07s linear;
            font-family: inherit;
            touch-action: manipulation;
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #b45a2b;
        }

        .question-text {
            font-size: clamp(1.2rem, 5vw, 1.8rem);
            font-weight: bold;
            background: #fef5e7;
            padding: 12px 16px;
            border-radius: 40px;
            margin: 5px 0;
            color: #333;
            border-left: 6px solid #ff8c42;
            border-right: 6px solid #ff8c42;
            word-break: break-word;
        }

        .images-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin: 15px 0;
        }

        .option-card {
            background: #f9f3e8;
            border-radius: 24px;
            padding: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 3px solid transparent;
            flex: 1;
            min-width: 140px;
            max-width: 280px;
            touch-action: manipulation;
        }

        .option-card:active {
            transform: scale(0.98);
        }

        .option-card img {
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.2);
            background-color: #e9ecef;
            display: block;
        }

        .message-area {
            background: #e9ecef;
            padding: 10px 16px;
            border-radius: 60px;
            font-weight: bold;
            font-size: clamp(1rem, 4vw, 1.2rem);
            margin: 10px auto;
            width: 95%;
            transition: 0.2s;
        }

        .correct-msg {
            background: #c8e6d9;
            color: #1e6f3f;
            border-left: 6px solid #2ecc71;
        }

        .wrong-msg {
            background: #ffe0db;
            color: #c0392b;
            border-left: 6px solid #e74c3c;
        }

        .progress {
            font-size: clamp(0.9rem, 3.5vw, 1.1rem);
            background: #2b4c7c20;
            display: inline-block;
            padding: 5px 16px;
            border-radius: 40px;
            font-weight: bold;
        }

        .end-screen h2 {
            font-size: clamp(1.3rem, 6vw, 2rem);
            color: #1e6f3f;
            margin: 10px 0;
        }

        .end-screen p {
            font-size: clamp(1rem, 4vw, 1.2rem);
            margin: 5px 0;
        }

        .final-score {
            font-size: clamp(2rem, 10vw, 3rem);
            font-weight: bold;
            background: #ffdeae;
            padding: 8px 24px;
            border-radius: 80px;
            display: inline-block;
        }

        .reset-btn {
            background: #2c3e66;
            box-shadow: 0 6px 0 #1b2a44;
            margin-top: 10px;
        }

        .hidden {
            display: none;
        }

        footer {
            margin-top: 20px;
            font-size: 0.7rem;
            color: #aaa;
        }

        /* Ajustes específicos para móviles muy pequeños */
        @media (max-width: 480px) {
            .game-container {
                padding: 16px 12px 24px;
                border-radius: 28px;
            }
            
            .images-row {
                gap: 12px;
            }
            
            .option-card {
                padding: 8px;
                border-radius: 20px;
            }
            
            .option-card img {
                border-radius: 16px;
            }
            
            button {
                padding: 10px 24px;
            }
        }

        /* Para tablets y pantallas medianas */
        @media (min-width: 768px) and (max-width: 1024px) {
            .option-card {
                max-width: 250px;
            }
            
            .images-row {
                gap: 30px;
            }
        }
    </style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <!-- PANTALLA INICIAL -->
    <div id="startScreen" class="start-screen">
        <h1>🧹 ¿Quién es el más responsable? 🍽️</h1>
        <p>Elige la imagen correcta en cada pregunta</p>
        <button id="startBtn">▶ INICIAR</button>
        <footer>⚡ Haz clic en una imagen para responder<br>Pasa automáticamente a la siguiente pregunta</footer>
    </div>

    <!-- PANTALLA DE PREGUNTAS -->
    <div id="quizScreen" class="quiz-screen hidden">
        <div class="progress" id="progressIndicator">Pregunta 1 / 10</div>
        <div class="question-text" id="questionText">Cargando...</div>
        <div class="images-row" id="imagesContainer"></div>
        <div id="messageBox" class="message-area"></div>
    </div>

    <!-- PANTALLA FINAL -->
    <div id="endScreen" class="end-screen hidden">
        <h2>🏆 Juego completado 🏆</h2>
        <p>Tu puntuación final:</p>
        <div class="final-score" id="finalScoreSpan">0 / 10</div>
        <button id="resetBtn" class="reset-btn">🔁 Volver a jugar</button>
    </div>
</div>

<script>
    // ============================================================
    // ★★★ CONFIGURACIÓN DEL JUEGO ★★★
    // ============================================================
    // La imagen INCORRECTA es SIEMPRE la misma para todas las preguntas
    // La imagen CORRECTA cambia en cada pregunta
    // SOLO se muestran las imágenes, sin texto debajo
    // DISEÑO RESPONSIVE para móviles y tablets
    // ============================================================
    
    // Nombre del archivo de la imagen incorrecta (siempre la misma)
    const IMAGEN_INCORRECTA = "incorrecta.jpg";
    
    // Carpeta donde están todas las imágenes
    const RUTA_IMAGENES = "img/";
    
    // Lista de preguntas - SOLO debes especificar la imagen correcta de cada una
    const preguntas = [
        { texto: "🧽 ¿Quién lava los trastes?", imgCorrecta: "trastes_correcto.jpg" },
        { texto: "🥪 ¿Quién hace mejores sándwiches?", imgCorrecta: "sandwiches_correcto.jpg" },
        { texto: "🏠 ¿Quién se debe quedar a hacer las labores del hogar?", imgCorrecta: "hogar_correcto.jpg" },
        { texto: "🛋️ ¿Quién ordena mejor la sala?", imgCorrecta: "sala_correcto.jpg" },
        { texto: "🗑️ ¿Quién saca la basura sin que le digan?", imgCorrecta: "basura_correcto.jpg" },
        { texto: "👕 ¿Quién plancha la ropa más rápido?", imgCorrecta: "plancha_correcto.jpg" },
        { texto: "🧺 ¿Quién pone la lavadora correctamente?", imgCorrecta: "lavadora_correcto.jpg" },
        { texto: "🐶 ¿Quién cuida mejor a las mascotas?", imgCorrecta: "mascotas_correcto.jpg" },
        { texto: "🧹 ¿Quién barre debajo de la mesa después de comer?", imgCorrecta: "barre_correcto.jpg" },
        { texto: "🚽 ¿Quién limpia el baño sin protestar?", imgCorrecta: "baño_correcto.jpg" }
    ];
    
    // ============================================================
    // CÓDIGO DEL JUEGO (NO MODIFICAR A MENOS QUE SEPAS)
    // ============================================================
    
    let currentIndex = 0;
    let score = 0;
    let waitingForNext = false;
    let nextTimeout = null;
    
    // Detectar si es móvil para ajustar tiempos (opcional)
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    const MESSAGE_DURATION = isMobile ? 1000 : 1300; // un poco más rápido en móvil
    
    // Elementos del DOM
    const startScreen = document.getElementById('startScreen');
    const quizScreen = document.getElementById('quizScreen');
    const endScreen = document.getElementById('endScreen');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const questionText = document.getElementById('questionText');
    const imagesContainer = document.getElementById('imagesContainer');
    const messageBox = document.getElementById('messageBox');
    const progressIndicator = document.getElementById('progressIndicator');
    const finalScoreSpan = document.getElementById('finalScoreSpan');
    
    function loadQuestion() {
        if (currentIndex >= preguntas.length) {
            showEndScreen();
            return;
        }
        
        messageBox.innerHTML = '';
        messageBox.className = 'message-area';
        imagesContainer.innerHTML = '';
        
        const pregunta = preguntas[currentIndex];
        questionText.textContent = pregunta.texto;
        progressIndicator.textContent = `Pregunta ${currentIndex+1} / ${preguntas.length}`;
        
        // Opción CORRECTA (imagen específica de esta pregunta)
        const correctDiv = document.createElement('div');
        correctDiv.className = 'option-card';
        const imgCorrect = document.createElement('img');
        imgCorrect.src = `${RUTA_IMAGENES}${pregunta.imgCorrecta}`;
        imgCorrect.alt = 'Opción 1';
        imgCorrect.loading = 'lazy';
        imgCorrect.onerror = () => {
            imgCorrect.src = 'https://placehold.co/400x400?text=Error+de+imagen';
            imgCorrect.style.objectFit = 'contain';
        };
        correctDiv.appendChild(imgCorrect);
        
        // Opción INCORRECTA (SIEMPRE la misma imagen)
        const incorrectDiv = document.createElement('div');
        incorrectDiv.className = 'option-card';
        const imgIncorrect = document.createElement('img');
        imgIncorrect.src = `${RUTA_IMAGENES}${IMAGEN_INCORRECTA}`;
        imgIncorrect.alt = 'Opción 2';
        imgIncorrect.loading = 'lazy';
        imgIncorrect.onerror = () => {
            imgIncorrect.src = 'https://placehold.co/400x400?text=Error+de+imagen';
            imgIncorrect.style.objectFit = 'contain';
        };
        incorrectDiv.appendChild(imgIncorrect);
        
        // Eventos táctiles y de ratón
        correctDiv.addEventListener('click', (e) => {
            e.stopPropagation();
            handleAnswer(true);
        });
        correctDiv.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleAnswer(true);
        }, { passive: false });
        
        incorrectDiv.addEventListener('click', (e) => {
            e.stopPropagation();
            handleAnswer(false);
        });
        incorrectDiv.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleAnswer(false);
        }, { passive: false });
        
        imagesContainer.appendChild(correctDiv);
        imagesContainer.appendChild(incorrectDiv);
        
        waitingForNext = false;
    }
    
    function handleAnswer(isCorrect) {
        if (waitingForNext) return;
        
        if (isCorrect) {
            score++;
            messageBox.innerHTML = '✅ ¡CORRECTO! ✅';
            messageBox.className = 'message-area correct-msg';
        } else {
            messageBox.innerHTML = `❌ INCORRECTO ❌`;
            messageBox.className = 'message-area wrong-msg';
        }
        
        waitingForNext = true;
        
        if (nextTimeout) clearTimeout(nextTimeout);
        
        nextTimeout = setTimeout(() => {
            currentIndex++;
            
            if (currentIndex < preguntas.length) {
                loadQuestion();
            } else {
                showEndScreen();
            }
            nextTimeout = null;
        }, MESSAGE_DURATION);
    }
    
    function showEndScreen() {
        quizScreen.classList.add('hidden');
        endScreen.classList.remove('hidden');
        finalScoreSpan.textContent = `${score} / ${preguntas.length}`;
        
        if (nextTimeout) {
            clearTimeout(nextTimeout);
            nextTimeout = null;
        }
    }
    
    function resetGame() {
        if (nextTimeout) {
            clearTimeout(nextTimeout);
            nextTimeout = null;
        }
        currentIndex = 0;
        score = 0;
        waitingForNext = false;
        
        endScreen.classList.add('hidden');
        quizScreen.classList.add('hidden');
        startScreen.classList.remove('hidden');
        
        messageBox.innerHTML = '';
        messageBox.className = 'message-area';
    }
    
    function startGame() {
        if (nextTimeout) clearTimeout(nextTimeout);
        currentIndex = 0;
        score = 0;
        waitingForNext = false;
        
        startScreen.classList.add('hidden');
        endScreen.classList.add('hidden');
        quizScreen.classList.remove('hidden');
        
        loadQuestion();
    }
    
    startBtn.addEventListener('click', startGame);
    resetBtn.addEventListener('click', resetGame);
    
    // Prevenir zoom doble tap en botones para mejor experiencia móvil
    const allButtons = document.querySelectorAll('button');
    allButtons.forEach(btn => {
        btn.addEventListener('touchstart', (e) => {
            // Permitir que el botón funcione normalmente
            return true;
        });
    });
    
    console.log(`📱 Modo ${isMobile ? 'MÓVIL' : 'ESCRITORIO'} detectado`);
    console.log(`📁 Las imágenes deben estar en: "${RUTA_IMAGENES}"`);
    console.log(`🖼️ Imagen incorrecta (siempre la misma): ${IMAGEN_INCORRECTA}`);
    console.log(`📋 Imágenes correctas necesarias:`);
    preguntas.forEach((p, i) => {
        console.log(`   ${i+1}. ${p.imgCorrecta}`);
    });
</script>
</body>
</html>
